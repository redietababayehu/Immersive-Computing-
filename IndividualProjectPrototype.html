<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Harder Gaze Scavenger Hunt</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <script>
      let currentLevel = 1;

      function goToLevel(level) {
        currentLevel = level;

        document.querySelectorAll(".level").forEach((el) => {
          el.setAttribute("visible", false);
        });

        document.querySelector("#level" + level).setAttribute("visible", true);

        if (level === 2) {
          randomizeObject();
        }
      }

      function foundItem() {
        if (currentLevel === 1) {
          alert("That was tricky... Level 2 is harder 😈");
          goToLevel(2);
        } else {
          alert("You actually found it?? You win 🔥");
        }
      }

      function randomizeObject() {
        const obj = document.querySelector("#hidden2");

        // Random position within room bounds
        const x = Math.random() * 6 - 3;
        const y = Math.random() * 2 + 0.2;
        const z = Math.random() * -6 - 2;

        obj.setAttribute("position", `${x} ${y} ${z}`);
      }
    </script>
  </head>

  <body>
    <a-scene>
      <!-- Camera with harder gaze -->
      <a-entity camera look-controls>
        <a-cursor
          fuse="true"
          fuse-timeout="1800"
          color="white"
          scale="0.5 0.5 0.5"
        ></a-cursor>
      </a-entity>

      <!-- Lighting (slightly dimmer = harder) -->
      <a-light type="ambient" intensity="0.4"></a-light>
      <a-light type="point" position="2 3 3" intensity="0.7"></a-light>

      <!-- ================= LEVEL 1 ================= -->
      <a-entity id="level1" class="level" visible="true">
        <!-- Room -->
        <a-box
          position="0 0 -5"
          depth="10"
          height="5"
          width="10"
          color="#d9d9d9"
        ></a-box>

        <!-- Clutter objects -->
        <a-box position="-2 0.5 -3" color="#aaa"></a-box>
        <a-box position="1 0.5 -2" color="#bbb"></a-box>
        <a-sphere position="2 1 -4" radius="1" color="#999"></a-sphere>
        <a-cylinder
          position="-1 1 -4"
          radius="0.5"
          height="2"
          color="#aaa"
        ></a-cylinder>
        <a-cone
          position="0 1 -6"
          radius-bottom="1"
          height="2"
          color="#bbb"
        ></a-cone>

        <!-- Hidden item (SMALL + camouflaged) -->
        <a-sphere
          position="0.3 0.4 -3.5"
          radius="0.15"
          color="#ff4d4d"
          onclick="foundItem()"
        ></a-sphere>

        <a-text
          value="Level 1: Find the tiny red dot"
          position="-2 2 -3"
          color="black"
        ></a-text>
      </a-entity>

      <!-- ================= LEVEL 2 ================= -->
      <a-entity id="level2" class="level" visible="false">
        <!-- Room -->
        <a-box
          position="0 0 -5"
          depth="10"
          height="5"
          width="10"
          color="#cfcfcf"
        ></a-box>

        <!-- MUCH MORE clutter -->
        <a-sphere position="-2 1 -3" radius="0.5" color="#888"></a-sphere>
        <a-sphere position="1 1 -2" radius="0.4" color="#777"></a-sphere>
        <a-sphere position="2 0.5 -5" radius="0.6" color="#999"></a-sphere>

        <a-box position="-1 0.5 -4" color="#aaa"></a-box>
        <a-box position="2 0.5 -3" color="#bbb"></a-box>

        <a-cylinder
          position="0 1 -6"
          radius="0.5"
          height="2"
          color="#888"
        ></a-cylinder>
        <a-cylinder
          position="-2 1 -5"
          radius="0.4"
          height="1.5"
          color="#777"
        ></a-cylinder>

        <!-- Distractor tiny objects -->
        <a-sphere position="1 0.3 -4" radius="0.15" color="#888"></a-sphere>
        <a-sphere position="-1 0.4 -3" radius="0.12" color="#999"></a-sphere>
        <a-sphere position="0 0.2 -5" radius="0.1" color="#aaa"></a-sphere>

        <!-- REAL hidden object (VERY hard) -->
        <a-sphere
          id="hidden2"
          position="0 0.3 -4"
          radius="0.12"
          color="#ff2e2e"
          onclick="foundItem()"
        ></a-sphere>

        <a-text
          value="Level 2: Find the hidden red speck"
          position="-2 2 -3"
          color="black"
        ></a-text>
      </a-entity>
    </a-scene>
  </body>
</html>
