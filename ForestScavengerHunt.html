<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rediet's Forest Scavenger Hunt</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>

    <script>
      let score = 0;
      let foundInLevel = 0;
      let musicOn = true;

      // START GAME LOGIC
      function startGame() {
        document.querySelector("#flashScreen").setAttribute("visible", false);
        document.querySelector("#ui-container").setAttribute("visible", true);
        document.querySelector("#level1").setAttribute("visible", true);

        if (musicOn) {
          document.querySelector("#bgMusic").components.sound.playSound();
        }
      }

      // SETUP OPTION: Toggle Music
      function toggleMusic() {
        musicOn = !musicOn;
        document
          .querySelector("#musicText")
          .setAttribute("value", "Music: " + (musicOn ? "ON" : "OFF"));
        document
          .querySelector("#musicText")
          .setAttribute("color", musicOn ? "#00FF00" : "#FF0000");
      }

      // SCORE & LEVEL LOGIC
      function itemFound(points, el) {
        if (!el.getAttribute("visible")) return;

        score += points;
        document
          .querySelector("#scoreText")
          .setAttribute("value", "Score: " + score);
        document.querySelector("#collectSound").components.sound.playSound();

        el.setAttribute("visible", false);
        el.classList.remove("clickable");

        foundInLevel++;
        let isLevel1 = document
          .querySelector("#level1")
          .getAttribute("visible");
        let required = isLevel1 ? 3 : 6;

        if (foundInLevel >= required) {
          if (isLevel1) {
            alert(
              "Level 1 Complete! In level 2 you must find two of each item",
            );
            startLevel2();
          } else {
            alert("🎉 Mission Accomplished! Final Score: " + score);
          }
        }
      }

      function startLevel2() {
        foundInLevel = 0;
        document.querySelector("#level1").setAttribute("visible", false);
        document.querySelector("#level2").setAttribute("visible", true);
      }

      // COLLISION DETECTION (Simple version)
      // This prevents the camera from getting too close to trees
      AFRAME.registerComponent("simple-collision", {
        tick: function () {
          var camPos = this.el.getAttribute("position");
          // If player goes too far out of bounds or hits a 'zone', reset them
          if (Math.abs(camPos.x) > 25 || Math.abs(camPos.z) > 25) {
            this.el.setAttribute("position", "0 1.6 0");
          }
        },
      });
    </script>
  </head>

  <body>
    <a-scene vr-mode-ui="enabled: true">
      <a-assets timeout="10000">
        <a-asset-item id="treeModel" src="Tree1.glb"></a-asset-item>
        <a-asset-item id="ballModel" src="soccerBall.glb"></a-asset-item>
        <a-asset-item id="trophyModel" src="trophy.glb"></a-asset-item>
        <audio id="bgMusicAsset" src="ambientForest.wav"></audio>
        <audio id="collectSnd" src="pointDing.wav"></audio>
      </a-assets>

      <a-entity
        environment="preset: forest; dressingAmount: 100; seed: 44"
      ></a-entity>
      <a-entity
        id="bgMusic"
        sound="src: #bgMusicAsset; loop: true; volume: 0.5"
      ></a-entity>
      <a-entity id="collectSound" sound="src: #collectSnd"></a-entity>

      <a-entity
        id="player"
        camera
        look-controls
        simple-collision
        position="0 1.6 0"
      >
        <a-cursor
          fuse="true"
          fuse-timeout="1200"
          raycaster="objects: .clickable"
          color="yellow"
        ></a-cursor>

        <a-entity id="ui-container" visible="false">
          <a-text
            id="scoreText"
            value="Score: 0"
            position="-0.8 -0.5 -1"
            scale="0.4 0.4 0.4"
            color="white"
          ></a-text>
        </a-entity>
      </a-entity>

      <a-entity id="flashScreen" position="0 1.6 -3">
        <a-plane color="#000" width="4" height="3" opacity="0.9"></a-plane>
        <a-text
          value="FOREST SCAVENGER HUNT 
          by: Rediet Ababayehu"
          align="center"
          position="0 0.8 0.1"
          scale="0.8 0.8 0.8"
        ></a-text>

        <a-text
          value="Goal: try and find the Acacia tree, Soccer ball, and Gold trophy"
          align="center"
          position="0 0.4 0.1"
          scale="0.5 0.5 0.5"
        ></a-text>

        <a-text
          id="musicText"
          class="clickable"
          value="Music: ON"
          align="center"
          position="0 0 0.1"
          scale="0.6 0.6 0.6"
          onclick="toggleMusic()"
        ></a-text>

        <a-box
          class="clickable"
          color="#228B22"
          position="0 -0.8 0.1"
          width="1.5"
          height="0.5"
          depth="0.1"
          onclick="startGame()"
        >
          <a-text
            value="START GAME"
            align="center"
            position="0 0 0.06"
            scale="0.5 0.5 0.5"
          ></a-text>
        </a-box>
      </a-entity>

      <a-entity id="level1" visible="false">
        <a-entity
          class="clickable"
          gltf-model="#treeModel"
          position="-4 0 -7"
          scale="1.5 1.5 1.5"
          onclick="itemFound(5, this)"
        ></a-entity>
        <a-entity
          class="clickable"
          gltf-model="#ballModel"
          position="5 0.2 -4"
          scale="0.1 0.1 0.1"
          onclick="itemFound(10, this)"
        ></a-entity>
        <a-entity
          class="clickable"
          gltf-model="#trophyModel"
          position="1 0.2 -9"
          scale="0.04 0.04 0.04"
          onclick="itemFound(15, this)"
        ></a-entity>
      </a-entity>

      <a-entity id="level2" visible="false">
        <a-entity
          class="clickable"
          gltf-model="#treeModel"
          position="-10 0 -5"
          scale="0.5 0.5 0.5"
          onclick="itemFound(5, this)"
        ></a-entity>
        <a-entity
          class="clickable"
          gltf-model="#treeModel"
          position="12 0 8"
          scale="0.5 0.5 0.5"
          onclick="itemFound(5, this)"
        ></a-entity>
        <a-entity
          class="clickable"
          gltf-model="#ballModel"
          position="0 0.1 10"
          scale="0.08 0.08 0.08"
          onclick="itemFound(10, this)"
        ></a-entity>
        <a-entity
          class="clickable"
          gltf-model="#ballModel"
          position="14 0.1 -14"
          scale="0.08 0.08 0.08"
          onclick="itemFound(10, this)"
        ></a-entity>
        <a-entity
          class="clickable"
          gltf-model="#trophyModel"
          position="-15 0.1 15"
          scale="0.02 0.02 0.02"
          onclick="itemFound(15, this)"
        ></a-entity>
        <a-entity
          class="clickable"
          gltf-model="#trophyModel"
          position="18 0.1 -2"
          scale="0.02 0.02 0.02"
          onclick="itemFound(15, this)"
        ></a-entity>
      </a-entity>
      <a-entity id="winScreen" position="0 1.6 -3" visible="false">
        <a-plane color="#000" width="4" height="3" opacity="0.9"></a-plane>
        <a-text
          value="GOOD JOB!"
          align="center"
          position="0 0.8 0.1"
          color="#FFD700"
          scale="1.2 1.2 1.2"
        ></a-text>
        <a-text
          value="You completed all the levels."
          align="center"
          position="0 0.2 0.1"
          scale="0.6 0.6 0.6"
        ></a-text>
      </a-entity>
    </a-scene>
  </body>
</html>
